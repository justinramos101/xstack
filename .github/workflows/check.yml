name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
      - run: node scripts/build.mjs --check
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Fetch the TLC that the statechart skill pins
        run: |
          read -r version sum < <(node --input-type=module -e 'import { TLC_TOOL } from "./src/skills/statechart/scripts/tlc-tools.mjs"; console.log(TLC_TOOL.match(/@([^@]+)$/)[1], TLC_TOOL.match(/sha256:(\w+)/)[1])')
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL -o "$jar" "https://github.com/tlaplus/tlaplus/releases/download/v$version/tla2tools.jar"
          echo "$sum  $jar" | sha256sum -c -
          test -x "$JAVA_HOME/bin/java"
          echo "TLA2TOOLS=$jar" >> "$GITHUB_ENV"
          echo "JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
      - run: node --test scripts/*.test.mjs src/skills/*/scripts/test/*.test.mjs
      - run: npx --yes @anthropic-ai/claude-code@latest plugin validate --strict ./claude
      - run: bun install --frozen-lockfile
        working-directory: src/skills/poteto-mode/scripts
      - run: bun run test && bun run typecheck
        working-directory: src/skills/poteto-mode/scripts
