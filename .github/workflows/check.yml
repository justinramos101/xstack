name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
      - run: node scripts/build.mjs --check
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false
      - run: node --test scripts/*.test.mjs src/skills/*/scripts/test/*.test.mjs
      - run: npx --yes @anthropic-ai/claude-code@latest plugin validate --strict ./claude
      - run: bun install --frozen-lockfile
        working-directory: src/skills/poteto-mode/scripts
      - run: bun run test && bun run typecheck
        working-directory: src/skills/poteto-mode/scripts
