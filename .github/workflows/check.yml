name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  platform:
    name: test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: runner.os == 'Linux'
        with:
          bun-version: '1.3.12'
      - run: node scripts/build.mjs --check
        if: runner.os == 'Linux'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Fetch the TLC that the statechart skill pins
        shell: pwsh
        run: |
          $pin = node --input-type=module -e "import { TLC_TOOL } from './src/skills/statechart/scripts/run.ts'; console.log(TLC_TOOL)"
          if ($pin -notmatch 'url=(?<url>[^,]+),checksum=sha256:(?<sum>[0-9a-f]{64})') { throw "Invalid TLC pin: $pin" }
          $jar = Join-Path $env:RUNNER_TEMP tla2tools.jar
          Invoke-WebRequest -Uri $Matches.url -OutFile $jar
          if ((Get-FileHash $jar -Algorithm SHA256).Hash -ne $Matches.sum) { throw 'TLC checksum mismatch' }
          "TLA2TOOLS=$jar" >> $env:GITHUB_ENV
      - run: npm ci && npm test
        if: runner.os == 'Linux'
      - name: Check native Windows rule violations and temporal loops with TLC
        if: runner.os == 'Windows'
        working-directory: src/skills/statechart/scripts
        run: node --test --test-name-pattern="an invariant named NoDeadlock|a property that breaks on a loop draws" test/corpus.test.ts
      - run: bun install --frozen-lockfile
        if: runner.os == 'Linux'
        working-directory: src/skills/poteto-mode/scripts
      - run: bun run test && bun run typecheck
        if: runner.os == 'Linux'
        working-directory: src/skills/poteto-mode/scripts
  test:
    needs: platform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both platform jobs to pass
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PLATFORM_RESULT" = success
